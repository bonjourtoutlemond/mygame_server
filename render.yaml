services:
  - type: web
    name: match-3-game
    runtime: node
    rootDir: match-3-game
    buildCommand: yarn install --production=true
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: eat_turntable
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
